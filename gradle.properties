kotlin.code.style=official

# Toolchain por defecto para compatibilidad IDE/CI (puede sobreescribirse con -Pmascostos.java.toolchain=21)
mascostos.java.toolchain=17

# Permite a Gradle detectar y/o descargar JDK del toolchain cuando sea posible
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
